<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Concluir lembrete</title>
<style>
  :root {
    --fundo: #f4f5f7;
    --cartao: #ffffff;
    --texto: #16181d;
    --fraco: #626875;
    --borda: #dfe2e8;
    --acao: #1f9d55;
    --acao-toque: #17784120;
    --erro: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #101216;
      --cartao: #1a1d23;
      --texto: #f0f1f4;
      --fraco: #9aa1ae;
      --borda: #2c3038;
      --acao: #2ec26f;
      --erro: #f2938c;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: var(--acao-toque); }
  body {
    margin: 0;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--fundo);
    color: var(--texto);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--cartao);
    border: 1px solid var(--borda);
    border-radius: 18px;
    padding: 28px 22px;
    text-align: center;
  }
  .lista {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--fraco);
    margin: 0 0 6px;
  }
  .titulo {
    font-size: 27px;
    font-weight: 650;
    line-height: 1.25;
    margin: 0 0 28px;
    overflow-wrap: anywhere;
  }
  .botao {
    display: block;
    width: 100%;
    padding: 20px 16px;
    border: none;
    border-radius: 14px;
    background: var(--acao);
    color: #fff;
    font-size: 20px;
    font-weight: 650;
    text-decoration: none;
    cursor: pointer;
  }
  .botao:active { filter: brightness(.92); }
  .dica {
    margin: 20px 0 0;
    font-size: 14px;
    color: var(--fraco);
  }
  .erro .titulo { color: var(--erro); font-size: 21px; }
  code {
    font-size: 13px;
    overflow-wrap: anywhere;
    color: var(--fraco);
  }
</style>
</head>
<body>
<main id="cartao"></main>
<script>
(function () {
  var NOME_ATALHO = "Concluir Lembrete";
  var cartao = document.getElementById("cartao");

  function texto(valor) {
    var no = document.createTextNode(valor);
    var span = document.createElement("span");
    span.appendChild(no);
    return span.innerHTML;
  }

  function erro(mensagem) {
    cartao.className = "erro";
    cartao.innerHTML =
      '<p class="lista">Link incompleto</p>' +
      '<p class="titulo">' + texto(mensagem) + "</p>" +
      '<p class="dica">Abra o lembrete direto no app Lembretes, ' +
      "ou confira o link no e-mail. Formato esperado:<br>" +
      "<code>?k=&lt;base64 de lista|titulo&gt;</code></p>";
  }

  // O dado vem em ?k=, num base64 de "lista|titulo".
  //
  // Por que não o fragmento (#), que seria melhor: o Gmail envolve todo link
  // num redirecionador próprio, e o navegador não envia a parte depois do '#'
  // ao pedir o redirecionador — o fragmento fica para trás no salto e a página
  // abre sem dado nenhum. A mesma propriedade que o protegia do log o mata aqui.
  //
  // O base64 não é segredo: é para o log de acesso guardar algo ilegível em vez
  // de "Exame de sangue" em texto claro. Quem quiser decodificar, decodifica.
  //
  // O formato antigo (lista/titulo soltos, em ?query ou em #fragmento) continua
  // aceito: e-mail já entregue não se corrige.
  function deBase64(txt) {
    var limpo = txt.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
    while (limpo.length % 4) limpo += "=";
    var bin = atob(limpo);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  var params;
  try {
    var bruto = window.location.hash.replace(/^#/, "");
    params = new URLSearchParams(window.location.search || bruto);
    if (!params.has("k") && !params.has("lista") && !params.has("titulo") && bruto) {
      params = new URLSearchParams(bruto);
    }
  } catch (e) {
    return erro("Não consegui ler os parâmetros do link.");
  }

  var lista = "";
  var titulo = "";
  var k = (params.get("k") || "").trim();
  if (k) {
    // Não chamar esta variável de "texto": o var sobe ao topo da função e
    // sombreia o texto() que escapa o HTML, deixando a página em branco.
    var decodificado;
    try {
      decodificado = deBase64(k);
    } catch (e) {
      return erro("O código do link veio corrompido e não pôde ser lido.");
    }
    // Parte no PRIMEIRO "|": título com barra vertical continua funcionando.
    var corte = decodificado.indexOf("|");
    if (corte === -1) {
      return erro("O código do link não separa a lista do título da tarefa.");
    }
    lista = decodificado.slice(0, corte).trim();
    titulo = decodificado.slice(corte + 1).trim();
  } else {
    lista = (params.get("lista") || "").trim();
    titulo = (params.get("titulo") || "").trim();
  }

  if (!lista && !titulo) return erro("O link não trouxe a lista nem o título da tarefa.");
  if (!lista) return erro("O link não trouxe o nome da lista.");
  if (!titulo) return erro("O link não trouxe o título da tarefa.");
  var destino =
    "shortcuts://run-shortcut" +
    "?name=" + encodeURIComponent(NOME_ATALHO) +
    "&input=text" +
    "&text=" + encodeURIComponent(lista + "|" + titulo);

  cartao.innerHTML =
    '<p class="lista">' + texto(lista) + "</p>" +
    '<p class="titulo">' + texto(titulo) + "</p>" +
    '<a class="botao" id="acao" href="' + destino.replace(/"/g, "%22") + '">✅ Concluir tarefa</a>' +
    '<p class="dica">Se nada acontecer, toque em “Abrir no Safari” ' +
    "no menu do app de e-mail e tente de novo.</p>";

  // O <a> resolve o caso comum; o clique programático cobre navegadores
  // embutidos que ignoram o href de esquema customizado no toque direto.
  document.getElementById("acao").addEventListener("click", function () {
    setTimeout(function () { window.location.href = destino; }, 0);
  });
})();
</script>
</body>
</html>
